<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="物販レジ">
<meta name="theme-color" content="#FFFFFF">
<title>物販レジ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
<script async src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{
  /* 白い紙と黒インク、見てほしい所だけ蛍光イエロー。1カラム、大きな商品写真、操作は画面下に固定。 */
  --ink:#0B0B0B; --paper:#FFFFFF; --mute:#858585; --ghost:#CDCDCD; --line:#E6E6E6; --wash:#F2F2F0;
  --mark:#FFF23B; --alert:#E0261C; --good:#1A9A48;
  --disp:"Outfit","Noto Sans JP",system-ui,sans-serif;
  --jp:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--jp);font-weight:500;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-feature-settings:"palt" 1;overscroll-behavior-y:none}
body.dark{background:var(--ink);color:var(--paper)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}
#app{max-width:600px;margin:0 auto;min-height:100%;padding:calc(var(--st) + 6px) 20px calc(var(--sb) + 170px)}
.top{display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:8px}
.icon{width:44px;height:44px;display:grid;place-items:center;flex:none}
.icon:first-child{margin-left:-10px}.icon:last-child{margin-right:-10px}
.icon svg{width:24px;height:24px}
.eyebrow{font-size:13px;font-weight:700;color:var(--mute)}
.h1{font-size:26px;font-weight:900;line-height:1.4;text-wrap:balance;margin:10px 0 22px}
.display{font-family:var(--disp);font-weight:900;font-size:72px;letter-spacing:-.02em;line-height:1}
.mk{background:var(--mark);color:var(--ink);padding:0 .14em}
.small{font-size:13px;color:var(--mute);line-height:1.6}
.dark .small{color:#9A9A9A}
.red{color:var(--alert);font-size:13px;line-height:1.6}
.sec{margin:30px 0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:18px;font-weight:900}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:62px;background:var(--ink);color:var(--paper);font-weight:700;font-size:17px;padding:0 16px;text-align:center}
.btn.out{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.inv{background:var(--paper);color:var(--ink)}
.btn.y{background:var(--mark);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.danger{background:var(--alert);color:#fff}
.btn[disabled]{background:#E4E4E4;color:#fff;box-shadow:none;cursor:default}
.btn.sm{min-height:44px;font-size:14px;width:auto;padding:0 14px}
.dark .btn.out{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 2px var(--paper)}
.link{font-weight:700;font-size:15px;border-bottom:1.5px dashed currentColor;padding:2px 0;display:inline-block}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:#555;font-weight:700}
.uin{border:0;border-bottom:2px solid var(--ink);background:transparent;font-family:var(--disp);font-weight:800;font-size:34px;padding:6px 0 8px;width:100%;border-radius:0;outline:none;font-variant-numeric:tabular-nums}
.uin.txt{font-family:var(--jp);font-weight:700;font-size:20px;padding:10px 0}
.uin.mid{font-size:26px}
.uin::placeholder{color:var(--ghost)}
.uin:focus{border-bottom-width:4px;padding-bottom:6px}
.uin.txt:focus{padding-bottom:8px}
textarea.uin{resize:vertical;min-height:90px;font-size:15px;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* Step（参考UI） */
.hero{background:var(--ink);color:var(--paper);margin:0 -20px;padding:22px 20px 30px}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:48px 1fr;column-gap:18px}
.step .box{width:48px;height:48px;border:3px solid currentColor;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:18px}
.step.on .box{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dark .step.on .box,.hero .step.on .box{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.step .lbl{align-self:center;font-weight:900;font-size:17px}
.step .rail{justify-self:center;width:0;border-left:3px dotted currentColor;min-height:30px}
.step.last .rail{border:0}
.step .body{padding:14px 0 30px}
.step.last .body{padding-bottom:0}

/* 商品タイル */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:520px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;border:2px solid var(--ink);background:var(--paper)}
.tile .tap{display:flex;flex-direction:column;width:100%;text-align:left;transition:transform .08s}
.tile .tap:active{transform:scale(.97)}
.minus{position:absolute;top:0;left:0;z-index:3;width:46px;height:46px;background:var(--ink);color:var(--paper);font-size:28px;font-weight:700;display:grid;place-items:center;line-height:1;text-align:center}
.minus:active{background:#444}
.ph{aspect-ratio:1/1;background:var(--wash);overflow:hidden;display:grid;place-items:center;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ini{font-weight:900;font-size:24px;color:#B9B9B6;padding:10px;text-align:center;line-height:1.25;word-break:break-all}
.tile .meta{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;border-top:2px solid var(--ink)}
.tile .nm{font-size:14px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.tile .pr{font-family:var(--disp);font-weight:800;font-size:21px;font-variant-numeric:tabular-nums}
.tile .vs{font-size:11px;color:var(--mute);font-weight:700}
.badge{position:absolute;top:0;right:0;background:var(--ink);color:var(--paper);font-family:var(--disp);font-weight:800;font-size:13px;padding:4px 8px;z-index:2}
.badge.low{background:var(--mark);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.incart{position:absolute;top:0;left:46px;z-index:2;background:var(--mark);min-width:42px;height:46px;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:20px;box-shadow:inset 0 0 0 2px var(--ink);padding:0 6px}
.tile.out{border-color:#A5A5A5}
.tile.out .ph::after{content:"SOLD OUT";position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,11,11,.74);color:#fff;font-family:var(--disp);font-weight:900;font-size:22px;letter-spacing:.06em}

/* カートバー / タブ */
.dockwrap{position:fixed;left:0;right:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.cartbar{bottom:calc(64px + var(--sb))}
.cartbar .in{pointer-events:auto;width:100%;max-width:600px;background:var(--ink);color:var(--paper);display:flex;align-items:stretch;min-height:68px}
.cartbar .sum{flex:1;padding:8px 16px;display:flex;flex-direction:column;justify-content:center;text-align:left;min-width:0}
.cartbar .sum b{font-family:var(--disp);font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.cartbar .sum span{font-size:12px;color:#BDBDBD}
.cartbar .undos{display:flex;flex-direction:column;border-left:1px solid #333;width:88px;flex:none}
.cartbar .undo{flex:1;color:#DADADA;font-size:12px;font-weight:700;text-align:center;padding:0 6px}
.cartbar .undo.clr{border-top:1px solid #333}
.cartbar .undo.arm{background:var(--alert);color:#fff}
.cartbar .go{background:var(--mark);color:var(--ink);font-weight:900;padding:0 22px;font-size:17px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--ink);z-index:21;padding-bottom:var(--sb)}
.tabbar .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--mute)}
.tabbar svg{width:22px;height:22px}
.tabbar button.on{color:var(--ink)}
.tabbar button.on span{background:var(--mark);padding:0 4px}
.dock{bottom:0;padding:12px 20px calc(var(--sb) + 12px);background:linear-gradient(rgba(255,255,255,0),var(--paper) 28%)}
.dark .dock{background:linear-gradient(rgba(11,11,11,0),var(--ink) 28%)}
.dock .in{pointer-events:auto;width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px}

/* シート */
.layer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--paper);color:var(--ink);width:100%;max-width:600px;max-height:calc(100% - var(--st) - 20px);overflow:auto;border-radius:18px 18px 0 0;padding:22px 20px calc(var(--sb) + 22px);animation:up .2s ease-out;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.sh h3{font-size:22px;font-weight:900;line-height:1.4;text-wrap:balance}
.x{width:36px;height:36px;border-radius:50%;background:#EFEFEF;display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* リスト・部品 */
.list{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li.void{opacity:.45}
.li.void .strike{text-decoration:line-through}
.thumb{width:56px;height:56px;flex:none;background:var(--wash);overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ini{font-size:12px;padding:4px}
.thumb.s{width:44px;height:44px}
.chip{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px;font-size:12px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--ink);white-space:nowrap;flex:none}
.chip.on{background:var(--ink);color:var(--paper)}
.chip.y{background:var(--mark)}
.chip.ghost{box-shadow:inset 0 0 0 1.5px var(--ghost);color:var(--mute)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);box-shadow:inset 0 0 0 2px var(--ink)}
.seg button{height:52px;font-weight:700;font-size:15px;text-align:center}
.seg button.on{background:var(--ink);color:var(--paper)}
.qty{display:flex;align-items:center;box-shadow:inset 0 0 0 2px var(--ink);flex:none}
.qty button{width:40px;height:40px;font-size:22px;font-weight:700;text-align:center}
.qty span{min-width:28px;text-align:center;font-family:var(--disp);font-weight:800;font-size:18px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.dark .kv{border-color:#2A2A2A}
.kv b{font-family:var(--disp);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;gap:12px}
.total b{font-family:var(--disp);font-weight:900;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{height:48px;box-shadow:inset 0 0 0 2px var(--ink);font-weight:700;font-size:14px;text-align:center}
.quick button:active{background:var(--mark)}
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink)}
.stats div{padding:14px 0;border-bottom:1px solid var(--line)}
.stats div:nth-child(odd){padding-right:12px}
.stats b{display:block;font-family:var(--disp);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.15}
.stats span{font-size:12px;color:var(--mute);font-weight:700}
.tbl{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{font-size:11px;color:var(--mute);font-weight:700;text-align:right;padding:6px 4px;border-bottom:2px solid var(--ink);white-space:nowrap}
.t th:first-child,.t td:first-child{text-align:left;padding-left:0}
.t td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
.t td.big{font-family:var(--disp);font-weight:800;font-size:20px}
.bar{display:flex;height:14px;box-shadow:inset 0 0 0 2px var(--ink);overflow:hidden}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;box-shadow:inset 0 0 0 1.5px var(--ink)}
.card{border:2px solid var(--ink);padding:18px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--paper)}
.card:active{background:var(--wash)}
.memo-line{background:var(--mark);padding:14px;font-weight:700;font-size:16px;line-height:1.7;box-shadow:inset 0 0 0 2px var(--ink)}
.sync{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:6px;color:var(--mute);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#BBB;flex:none}
.sync.ok i{background:var(--good)}
.sync.warn i{background:var(--alert)}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;font-weight:700;font-size:14px;z-index:99;max-width:calc(100% - 40px);box-shadow:0 0 0 3px var(--mark);animation:fade .15s}
.empty{border:2px dashed var(--ghost);padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.switch{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.tg{width:54px;height:32px;box-shadow:inset 0 0 0 2px var(--ink);position:relative;flex:none;background:var(--paper)}
.tg::after{content:"";position:absolute;top:5px;left:5px;width:22px;height:22px;background:var(--ghost);transition:left .15s}
.tg.on{background:var(--mark)}
.tg.on::after{left:27px;background:var(--ink)}
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-pick .thumb{width:96px;height:96px;box-shadow:inset 0 0 0 2px var(--ink)}
.hint{font-size:12px;color:var(--mute);line-height:1.6}
.vargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.varbtn{min-height:84px;box-shadow:inset 0 0 0 2px var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:8px}
.varbtn b{font-family:var(--disp);font-weight:900;font-size:24px;line-height:1.1}
.varbtn span{font-size:12px;font-weight:700}
.varbtn[disabled]{box-shadow:inset 0 0 0 2px var(--ghost);color:var(--ghost)}
.varbtn:active{background:var(--mark)}
.varcell{display:flex;flex-direction:column;gap:6px}
.varminus{height:38px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;text-align:center}
.edit-bar{background:var(--mark);box-shadow:inset 0 0 0 2px var(--ink);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:14px;margin-bottom:14px}
.rf{color:var(--alert);font-weight:700}
#scan{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column}
#scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scan .frame{position:absolute;left:50%;top:44%;width:min(68vw,300px);aspect-ratio:1/1;transform:translate(-50%,-50%);box-shadow:0 0 0 9999px rgba(0,0,0,.55);outline:4px solid var(--mark)}
#scan .msg{position:absolute;left:0;right:0;top:calc(var(--st) + 24px);text-align:center;color:#fff;font-weight:900;font-size:17px;padding:0 20px}
#scan .bot{position:absolute;left:20px;right:20px;bottom:calc(var(--sb) + 20px);display:flex;flex-direction:column;gap:10px}
.cpn{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cpn-on{background:var(--mark);box-shadow:inset 0 0 0 2px var(--ink);padding:10px 12px;display:flex;align-items:center;gap:10px;font-weight:700}
.qrgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.qrgrid figure{box-shadow:inset 0 0 0 2px var(--ink);padding:10px;text-align:center}
.qrgrid img{width:100%;image-rendering:pixelated;display:block}
.qrgrid figcaption{font-family:var(--disp);font-weight:800;font-size:13px;margin-top:6px;word-break:break-all}
.note-box{background:var(--mark);box-shadow:inset 0 0 0 2px var(--ink);padding:12px 14px;font-weight:700;font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.notecard{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.dark .notecard{border-color:#2A2A2A}
.dark .note-box{color:var(--ink)}
.tile .info{position:absolute;bottom:0;left:0;z-index:2;background:var(--mark);font-size:11px;font-weight:900;padding:3px 7px;box-shadow:inset 0 0 0 2px var(--ink)}
.chip.team{background:var(--ink);color:var(--mark);box-shadow:none}
.regbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.regbtns button{height:64px;box-shadow:inset 0 0 0 2px var(--ink);font-family:var(--disp);font-weight:900;font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.regbtns button.on{background:var(--ink);color:var(--paper)}
.regbtns button small{font-family:var(--jp);font-size:10px;font-weight:700;color:var(--mute)}
.howto{counter-reset:h;display:flex;flex-direction:column;gap:14px}
.howto li{list-style:none;display:grid;grid-template-columns:34px 1fr;gap:12px;font-size:15px;line-height:1.6}
.howto li::before{counter-increment:h;content:counter(h);width:34px;height:34px;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--disp);font-weight:800}
.den{display:grid;grid-template-columns:76px 1fr 92px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.den .lab{font-family:var(--disp);font-weight:800;font-size:18px;line-height:1.1}
.den .lab small{display:block;font-family:var(--jp);font-size:10px;color:var(--mute);font-weight:700}
.den .ctl{display:flex;align-items:center;box-shadow:inset 0 0 0 2px var(--ink)}
.den .ctl button{width:40px;height:44px;font-size:20px;font-weight:700;text-align:center;flex:none}
.den .ctl input{width:100%;min-width:0;height:44px;border:0;border-left:2px solid var(--ink);border-right:2px solid var(--ink);text-align:center;font-family:var(--disp);font-weight:800;font-size:20px;background:transparent;outline:none;border-radius:0}
.den .ctl input::placeholder{color:var(--ghost)}
.den .sub{text-align:right;font-family:var(--disp);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.den-total{position:sticky;bottom:calc(-22px - var(--sb));background:var(--paper);padding:14px 0 6px;border-top:2px solid var(--ink);margin-top:6px}
.giftbtn{height:32px;padding:0 10px;font-size:12px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--ink)}
.giftbtn.on{background:var(--mark)}
.pill-low{background:var(--mark);padding:0 6px;font-weight:900}

<body>
<div id="app"><div style="padding:40px 4px;font-size:15px;line-height:1.8"><b>読み込み中…</b><br><span style="color:#888;font-size:13px">しばらくたってもこのままの場合は、ページを再読み込みしてください。</span></div></div>
<div id="fatal"></div>
<script>
window.__showErr=function(m){var f=document.getElementById('fatal');if(!f)return;f.innerHTML='<div style="position:fixed;left:12px;right:12px;bottom:12px;z-index:999;background:#E0261C;color:#fff;padding:14px;font:600 13px/1.6 sans-serif;white-space:pre-wrap">エラーが起きました。この画面のスクリーンショットをClaudeに送ってください。\n'+String(m).replace(/</g,'&lt;')+'</div>'};
window.addEventListener('error',function(e){window.__showErr((e.message||'')+' '+(e.lineno?'(行 '+e.lineno+')':''))});
window.addEventListener('unhandledrejection',function(e){var r=e.reason;window.__showErr(r&&(r.message||r)||'unknown')});
</script>
<div id="layer"></div>
<div id="toast"></div>
<script>
/* ===== 基本ユーティリティ ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+(Math.round(n)||0).toLocaleString('ja-JP');
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const toHalf=v=>String(v??'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
const digits=v=>{const s=toHalf(v).replace(/[^0-9]/g,'');return s===''?null:Math.min(parseInt(s,10),999999999)};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=s=>{if(!s)return '日付なし';const d=new Date(s+'T00:00:00');if(isNaN(d))return s;return (d.getMonth()+1)+'/'+d.getDate()+'（'+'日月火水木金土'[d.getDay()]+'）'};
const hm=t=>new Date(t).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
const PAY={cash:'現金',card:'キャッシュレス',other:'その他',none:'プレゼント'};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const IC={
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M20 12H5M11 5l-7 7 7 7"/></svg>',
 close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>',
 reg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7.5" height="7.5"/><rect x="13.5" y="3" width="7.5" height="7.5"/><rect x="3" y="13.5" width="7.5" height="7.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5"/></svg>',
 stock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/></svg>',
 hist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 6h13M8 12h13M8 18h13M3 6h1.5M3 12h1.5M3 18h1.5"/></svg>',
 sum:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M2 21h20M6 18v-6M12 18V5M18 18v-9"/></svg>',
 up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 15l6-6 6 6"/></svg>',
 down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>',
 cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13.5" r="3.5"/></svg>'
};

/* ===== データ（Googleスプレッドシートと同期） ===== */
const HAS_GAS=!!(window.google&&google.script&&google.script.run);
const API_KEY='merch-register-api';
function apiFromSearch(){try{const q=new URLSearchParams(location.search);const id=q.get('s');if(id&&/^[\w-]{20,}$/.test(id)){const u='https://script.google.com/macros/s/'+id+'/exec';localStorage.setItem(API_KEY,u);history.replaceState(null,'',location.pathname);return u}}catch(e){}return null}
let API_URL=HAS_GAS?'':(apiFromSearch()||(()=>{try{return localStorage.getItem(API_KEY)||''}catch(e){return ''}})());
const apiId=u=>{const m=String(u||'').match(/\/macros\/s\/([\w-]+)\//);return m?m[1]:''};
const LS='merch-register-gas.v1'+(API_URL?':'+apiId(API_URL):'');
const LIVE_CAM=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)&&(()=>{try{return window.top===window.self}catch(e){return false}})();
let S={docs:{}};
let dirty=new Set();
let dels=[];
let AUTH={master:'',codes:{}};
let SINCE=0;
const UI={view:'home',aid:null,eid:null,tab:'reg',cart:[],hist:[],disc:0,recv:null,pay:'cash',lastTx:null,sheet:null,hf:'all',regs:{}};
const R={api:HAS_GAS||!!API_URL,ok:false,offline:false,syncing:false,hasAdmin:null};
let pendingRender=false;
try{UI.localOnly=localStorage.getItem('merch-register-local')==='1'}catch(e){}

function loadLocal(){
  try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);
    S.docs=o.docs||{};dirty=new Set(o.dirty||[]);dels=o.dels||[];AUTH=o.auth||AUTH;AUTH.codes=AUTH.codes||{};SINCE=o.since||0;
    const u=o.ui||{};
    Object.assign(UI,{view:u.view||'home',aid:u.aid||null,eid:u.eid||null,tab:u.tab||'reg',cart:u.cart||[],pay:u.pay||'cash',cartEid:u.cartEid||u.eid||null,editTx:u.editTx||null,disc:u.disc||0,recv:u.recv??null,regs:u.regs||{}});
  }}catch(e){}
  if(UI.view==='done')UI.view='event';
}
function saveLocal(){
  try{localStorage.setItem(LS,JSON.stringify({docs:S.docs,dirty:[...dirty],dels,auth:AUTH,since:SINCE,ui:{view:UI.view,aid:UI.aid,eid:UI.eid,tab:UI.tab,cart:UI.cart,pay:UI.pay,cartEid:UI.cartEid,editTx:UI.editTx,disc:UI.disc,recv:UI.recv,regs:UI.regs}}))}
  catch(e){toast('この端末の保存領域がいっぱいです。写真を減らしてください')}
}
function commit(key,opt){
  const d=S.docs[key];if(d)d.updatedAt=Date.now();
  dirty.add(key);saveLocal();syncSoon();
  if(!opt||opt.render!==false)render();else setStatus();
}
const timers={};
function saveSoon(key){clearTimeout(timers[key]);timers[key]=setTimeout(()=>{delete timers[key];commit(key,{render:false})},600)}
function flushSoon(){for(const k in timers){clearTimeout(timers[k]);delete timers[k];commit(k,{render:false})}}
const aidOf=d=>d.kind==='artist'?d.id:(d.aid||'');
function removeDoc(key){const d=S.docs[key];if(!d)return;dels.push({k:key,aid:aidOf(d),u:Date.now()});delete S.docs[key];dirty.delete(key);saveLocal();syncSoon()}
const isMaster=()=>!R.api||!!AUTH.master;
const loggedIn=()=>!R.api||!!AUTH.master||Object.keys(AUTH.codes).length>0;
function call(fn,arg,url){
  if(HAS_GAS&&!url)return new Promise((res,rej)=>{try{google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](arg)}catch(e){rej(e)}});
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),25000);
  return fetch(url||API_URL,{method:'POST',body:JSON.stringify({fn,arg}),signal:ctl.signal,redirect:'follow'})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(j=>{if(j&&j.error==='server')throw new Error(j.message||'server');return j})
    .finally(()=>clearTimeout(tm));
}
let syncT=null;
function syncSoon(){clearTimeout(syncT);syncT=setTimeout(sync,350)}
async function sync(){
  if(!R.api||!loggedIn())return;
  if(R.syncing){R.again=true;return}
  R.syncing=true;setStatus();
  const sent=[...dirty].map(k=>{const d=S.docs[k];return d?{k,aid:aidOf(d),kind:d.kind,u:d.updatedAt||0,j:JSON.stringify(d)}:null}).filter(Boolean);
  const sentDels=dels.slice();
  let changed=false;
  try{
    const res=await call('sync',{auth:AUTH,since:SINCE,changes:sent.concat(sentDels.map(x=>({k:x.k,aid:x.aid,kind:'del',u:x.u,j:null})))});
    if(!res||!res.ok){
      if(res&&res.error==='auth'){AUTH.master='';saveLocal();toast('管理者パスワードが変わったため、ログアウトしました');changed=true}
      throw new Error('sync');
    }
    const acc=new Set(res.accepted||[]);
    for(const c of sent){if(acc.has(c.k)&&S.docs[c.k]&&(S.docs[c.k].updatedAt||0)===c.u)dirty.delete(c.k)}
    for(const k of res.rejected||[])dirty.delete(k);
    dels=dels.filter(x=>!sentDels.includes(x));
    for(const r of res.rows||[]){
      if(dirty.has(r.k))continue;const ld=S.docs[r.k];
      if(r.j==null){if(ld){delete S.docs[r.k];changed=true}continue}
      if(!ld||r.u>(ld.updatedAt||0)){try{S.docs[r.k]=JSON.parse(r.j);changed=true}catch(e){}}
    }
    if(res.allowed!=='*'){
      const al=new Set(res.allowed||[]);
      for(const a of Object.keys(AUTH.codes))if(!al.has(a)){delete AUTH.codes[a];toast('合言葉が変わったアーティストがあります。新しい合言葉を聞いてください')}
      for(const [k,d] of Object.entries(S.docs)){if(!al.has(aidOf(d))&&!dirty.has(k)){delete S.docs[k];changed=true}}
    }
    SINCE=res.now;R.ok=true;R.offline=false;saveLocal();
  }catch(e){if(!(e&&e.message==='sync'))R.offline=true}
  finally{
    R.syncing=false;setStatus();if(changed)safeRender();
    if(R.again||((dirty.size||dels.length)&&!R.offline)){R.again=false;syncSoon()}
  }
}
async function start(){
  render();
  if(!R.api)return;
  try{const st=await Promise.race([call('status'),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),15000))]);R.hasAdmin=!!st.hasAdmin}
  catch(e){R.offline=true;R.startErr=String(e&&e.message||e)}
  render();sync();
  setInterval(()=>{if(document.visibilityState==='visible')sync()},12000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
}
function statusInfo(){
  if(!R.api)return{c:'warn',t:'この端末だけに保存（共有されません）'};
  if(R.offline)return{c:'warn',t:'オフライン：端末に保存中'};
  if(R.syncing||dirty.size||dels.length)return{c:'',t:'同期中…'};
  if(R.ok)return{c:'ok',t:'共有済み'};
  return{c:'',t:'つないでいます…'};
}
function syncHTML(){const s=statusInfo();return `<span class="sync ${s.c}"><i></i><span>${s.t}</span></span>`}
function setStatus(){const s=statusInfo();$$('.sync').forEach(el=>{el.className='sync '+s.c;el.lastChild.textContent=s.t})}

/* ===== 参照 ===== */
const AR=id=>S.docs['a_'+id];
const EV=id=>S.docs['e_'+id];
const artists=()=>Object.values(S.docs).filter(d=>d.kind==='artist').sort((a,b)=>lastUse(b)-lastUse(a));
const eventsOf=aid=>Object.values(S.docs).filter(d=>d.kind==='event'&&d.aid===aid).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
const txOf=eid=>Object.values(S.docs).filter(d=>d.kind==='tx'&&d.eid===eid).sort((a,b)=>a.t-b.t);
const TX=id=>id?S.docs['x_'+id]:null;
const myReg=eid=>(UI.regs&&UI.regs[eid])||'';
const noLabel=t=>'#'+(t.reg?t.reg+'-':'')+t.no;
function nextNo(eid){const r=myReg(eid);return txOf(eid).filter(t=>(t.reg||'')===r).reduce((m,t)=>Math.max(m,t.no||0),0)+1}
const nextLabel=eid=>'#'+(myReg(eid)?myReg(eid)+'-':'')+nextNo(eid);
function newTx(e,f){const id=nid();const t=Object.assign({kind:'tx',id,eid:e.id,aid:e.aid,sp:e.sp||'me',reg:myReg(e.id),no:nextNo(e.id),t:Date.now(),memo:false},f);S.docs['x_'+id]=t;return t}
const isTeam=d=>{if(!d)return false;const a=d.kind==='artist'?d:AR(d.aid);return !!(a&&a.shared)};
function lastUse(a){return Math.max(a.updatedAt||0,...eventsOf(a.id).map(e=>e.updatedAt||0))}
function skus(ar){const out=[];for(const p of (ar&&ar.products)||[]){if(p.vars&&p.vars.length){for(const v of p.vars)out.push({s:p.id+'~'+v.id,p,v,label:p.name+'（'+v.name+'）'})}else out.push({s:p.id,p,v:null,label:p.name})}return out}
function skuMap(ar){const m={};skus(ar).forEach(x=>m[x.s]=x);return m}
function phSrc(p){const ph=p&&p.ph;if(!ph)return null;if(ph.k){const d=S.docs[ph.k];return d&&d.d||null}return ph.d||null}
function phHTML(p){const src=phSrc(p);if(src){return `<img src="${esc(src)}" alt="" loading="lazy">`}return `<span class="ini">${esc((p&&p.name||'?').slice(0,6))}</span>`}
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.dataset.fb&&!t.src.endsWith(t.dataset.fb)){t.src=t.dataset.fb}},true);

function rfQty(t,i){let n=0;for(const r of t.rf||[])for(const x of r.items)if(x.i===i)n+=x.q;return n}
const rfAmt=t=>(t.rf||[]).reduce((a,r)=>a+r.amt,0);
const fullyRefunded=t=>!!(t.rf&&t.rf.length)&&t.items.every((it,i)=>rfQty(t,i)>=it.q);
function calc(ev){
  const skip=ev.id===UI.eid?UI.editTx:null;
  const sold={},gift={},rev={},lost={};let cpN=0,cpAmt=0,total=0,customers=0,items=0,giftN=0,cash=0,card=0,other=0,disc=0,unmemo=0,refund=0,refundN=0;
  const bucket=(pay,v)=>{if(pay==='cash')cash+=v;else if(pay==='card')card+=v;else if(pay==='other')other+=v};
  for(const t of txOf(ev.id)){if(t.v||t.id===skip)continue;let paid=0;
    t.items.forEach((it,i)=>{const nq=it.q-rfQty(t,i);
      if(it.g){gift[it.s]=(gift[it.s]||0)+nq;giftN+=nq}else{sold[it.s]=(sold[it.s]||0)+nq;rev[it.s]=(rev[it.s]||0)+nq*it.p;items+=nq;paid+=nq}});
    for(const r of t.rf||[]){refund+=r.amt;bucket(r.pay,-r.amt);refundN++;
      if(!r.back)for(const x of r.items){const it=t.items[x.i];if(it)lost[it.s]=(lost[it.s]||0)+x.q}}
    if(paid>0)customers++;
    if(!t.memo)unmemo++;
    total+=t.total-rfAmt(t);disc+=t.disc||0;if(t.cp){cpN++;cpAmt+=t.cp.amt||0}bucket(t.pay,t.total);
  }
  const tracked=s=>ev.stock&&ev.stock[s]!=null;
  const remain=s=>tracked(s)?(ev.stock[s]-(sold[s]||0)-(gift[s]||0)-(lost[s]||0)):Infinity;
  return{cpN,cpAmt,sold,gift,rev,lost,total,customers,items,giftN,cash,card,other,disc,unmemo,refund,refundN,remain,tracked};
}

/* ===== カート ===== */
const cartQty=s=>UI.cart.filter(c=>c.s===s).reduce((a,c)=>a+c.q,0);
function cartSum(ar){
  const m=skuMap(ar);
  const ls=UI.cart.map((c,i)=>{const x=m[c.s];const price=x?x.p.price:0;return{...c,i,x,price,line:c.g?0:price*c.q}});
  const sub=ls.reduce((a,l)=>a+l.line,0);const disc=Math.min(UI.disc||0,sub);
  const cp=UI.coupon&&findCoupon(ar,UI.coupon.id);let cd=0;
  if(cp){const base=sub-disc;cd=cp.type==='pct'?Math.floor(base*Math.min(100,cp.value||0)/100):Math.min(cp.value||0,base)}
  return{ls,sub,disc,cp,cd,total:sub-disc-cd,count:ls.reduce((a,l)=>a+l.q,0)};
}
function addToCart(s){
  const ev=EV(UI.eid);const st=calc(ev);
  if(st.remain(s)-cartQty(s)<=0){toast('在庫がありません。在庫タブで数を直せます');buzz(120);return false}
  const line=UI.cart.find(c=>c.s===s&&!c.g);if(line)line.q++;else UI.cart.push({s,q:1,g:0});
  UI.hist.push(s);buzz(12);saveLocal();return true;
}
function removeOne(s){
  const l=[...UI.cart].reverse().find(c=>c.s===s&&!c.g)||[...UI.cart].reverse().find(c=>c.s===s);
  if(!l)return;l.q--;if(l.q<=0)UI.cart.splice(UI.cart.indexOf(l),1);
  const k=UI.hist.lastIndexOf(s);if(k>=0)UI.hist.splice(k,1);buzz(8);saveLocal();
}
function resetCart(){UI.coupon=null;UI.noteAck=[];UI.cart=[];UI.hist=[];UI.disc=0;UI.recv=null;UI.pay='cash';UI.editTx=null}

/* ===== 画面 ===== */
function safeRender(){const a=document.activeElement;if(a&&a.matches&&a.matches('input,textarea')){pendingRender=true;return}render()}
document.addEventListener('focusout',()=>{if(pendingRender){pendingRender=false;setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches&&a.matches('input,textarea')))render();else pendingRender=true},50)}});

function render(){
  if((UI.view==='artist'||UI.view==='products')&&!AR(UI.aid))UI.view='home';
  if((UI.view==='event'||UI.view==='setup'||UI.view==='done')&&(!EV(UI.eid)||!AR(UI.aid)))UI.view=AR(UI.aid)?'artist':'home';
  let html='';
  switch(UI.view){
    case 'artist':html=vArtist();break;
    case 'products':html=vProducts();break;
    case 'setup':html=vSetup();break;
    case 'event':html=vEvent();break;
    case 'done':html=vDone();break;
    default:html=vHome();
  }
  $('#app').innerHTML=html;
  document.body.classList.toggle('dark',UI.view==='done'||(UI.view==='home'&&(!artists().length||(!HAS_GAS&&!API_URL&&!UI.localOnly)||(R.api&&(R.hasAdmin===false||!loggedIn())))));
  renderLayer();
}
const topBar=(left,mid,right)=>`<div class="top">${left||'<span class="icon"></span>'}<div class="grow center">${mid||''}</div>${right||'<span class="icon"></span>'}</div>`;
const backBtn=(v,label='戻る')=>`<button class="icon" data-act="go" data-v="${v}" aria-label="${label}">${IC.back}</button>`;

/* --- ホーム --- */
function vHome(){
  if(!HAS_GAS&&!API_URL&&!UI.localOnly){
    return `${topBar('','')}
    <div class="display" style="margin:28px 0 30px">Connect</div>
    <h1 class="h1" style="color:var(--paper)">つなぐ<span class="mk">スプレッドシート</span>を入れます</h1>
    <p class="small">管理者から届いたリンクから開いた場合は、この画面は出ません。管理者の方は、Apps Scriptのウェブアプリの URL（最後が /exec）を貼り付けてください。</p>
    <div class="field" style="margin-top:26px"><label for="f-api" style="color:#bbb">ウェブアプリのURL</label><input class="uin txt" style="color:var(--paper);border-color:var(--paper);font-size:15px" id="f-api" inputmode="url" autocomplete="off" autocapitalize="off" data-bind="tmp" data-k="api" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <div class="dockwrap dock"><div class="in">
      <button class="btn inv" data-act="apiSave">つなぐ</button>
      <button class="btn out" data-act="localOnly">つながずに、この端末だけで使う</button>
    </div></div>`;
  }
  if(R.api&&R.hasAdmin===false){
    return `${topBar('',syncHTML())}
    <div class="display" style="margin:28px 0 30px">Setup</div>
    <h1 class="h1" style="color:var(--paper)">はじめに<span class="mk">管理者パスワード</span>を決めます</h1>
    <p class="small">あなた（管理者）だけが使うパスワードです。アーティストの追加と、スタッフ用の合言葉の発行ができます。6文字以上にしてください。</p>
    <div class="field" style="margin-top:26px"><label for="f-ap" style="color:#bbb">管理者パスワード</label><input class="uin txt" style="color:var(--paper);border-color:var(--paper)" id="f-ap" type="password" autocomplete="new-password" data-bind="tmp" data-k="ap"></div>
    <div class="field" style="margin-top:18px"><label for="f-ap2" style="color:#bbb">もう一度</label><input class="uin txt" style="color:var(--paper);border-color:var(--paper)" id="f-ap2" type="password" autocomplete="new-password" data-bind="tmp" data-k="ap2"></div>
    <p class="red" style="margin-top:12px">忘れると管理者として入れなくなります。メモして保管してください。</p>
    <div class="dockwrap dock"><div class="in"><button class="btn inv" data-act="setAdmin">このパスワードにする</button></div></div>`;
  }
  if(R.api&&!loggedIn()&&R.hasAdmin==null){

function vEvent(){

  const tabs=[['reg','レジ',IC.reg],['stock','在庫',IC.stock],['hist','履歴',IC.hist],['sum','集計',IC.sum]];

function tReg(a,e){
  const st=calc(e);const ps=a.products||[];const c=cartSum(a);
  const tiles=ps.map(p=>{
    const ss=p.vars&&p.vars.length?p.vars.map(v=>p.id+'~'+v.id):[p.id];
    const tr=ss.filter(s=>st.tracked(s));
    const rem=tr.reduce((x,s)=>x+Math.max(0,st.remain(s)),0);
    const inc=ss.reduce((x,s)=>x+cartQty(s),0);
    const out=tr.length===ss.length&&rem-inc<=0&&inc===0;
    const left=rem-inc;
    const badge=tr.length?`<span class="badge ${left<=3?'low':''}">残${Math.max(0,left)}</span>`:'';
    return `<div class="tile ${out?'out':''}">
      ${inc?`<button class="minus" data-act="tileMinus" data-id="${p.id}" aria-label="${esc(p.name)}を1つ減らす">−</button><span class="incart">${inc}</span>`:''}

      <div class="ph">${phHTML(p)}${p.note?'<span class="info">案内あり</span>':''}</div>
      <div class="meta"><div class="nm">${esc(p.name)}</div><div class="row" style="justify-content:space-between"><span class="pr">${yen(p.price)}</span>${p.vars&&p.vars.length?`<span class="vs">${p.vars.length}種</span>`:''}</div></div>

      <div style="text-align:right"><div>${syncHTML()}</div><div class="small">売上 ${yen(st.total)} ・ ${st.customers}人</div></div>
    </div>
    ${et?`<div class="edit-bar"><span>${noLabel(et)} の内容を直しています（番号はそのまま）</span><button class="link" data-act="cancelEdit">やめる</button></div>`:''}
    ${ps.length?`<div class="tiles">${tiles}</div>`:`<div class="empty"><b>商品がありません</b><button class="btn sm" data-act="toProducts">商品を登録する</button></div>`}
    ${c.count?`<div class="dockwrap cartbar"><div class="in">

      <button class="go" data-act="openCart">会計へ →</button></div></div>`:''}`;
}
function tStock(a,e){
  const st=calc(e);const list=skus(a);
  let remainAll=0;const lows=[];
  list.forEach(x=>{if(st.tracked(x.s)){const r=st.remain(x.s);remainAll+=Math.max(0,r);if(r<=3)lows.push(x)}});
  return `<div class="stats" style="margin-top:6px">
      <div><span>残り在庫</span><b>${remainAll}</b></div><div><span>売れた数</span><b>${st.items}</b></div>
      <div><span>プレゼント</span><b>${st.giftN}</b></div><div><span>残りわずか・完売</span><b>${lows.length}</b></div>
    </div>
    <p class="hint" style="margin:12px 0 4px">プレゼント（無償で渡した分）は各行の「プレゼント」から記録できます。レジのカート内でも切り替えられます。</p>
    ${(a.products||[]).map(p=>{const ss=list.filter(x=>x.p.id===p.id);return `
      <div class="sec" style="margin:22px 0">
        <div class="row" style="margin-bottom:8px"><div class="thumb">${phHTML(p)}</div><div class="grow"><div style="font-weight:900;line-height:1.4">${esc(p.name)}</div><div class="small num">${yen(p.price)}</div></div></div>
        <div class="tbl"><table class="t"><thead><tr><th>${p.vars&&p.vars.length?'種類':''}</th><th>開始</th><th>販売</th><th>プレゼント</th><th>残り</th><th></th></tr></thead><tbody>
        ${ss.map(x=>{const tr=st.tracked(x.s);const r=st.remain(x.s);return `<tr>
          <td style="font-weight:700">${x.v?esc(x.v.name):'—'}</td>
          <td>${tr?e.stock[x.s]:'<span class="small">数えない</span>'}</td>
          <td>${st.sold[x.s]||0}</td><td>${st.gift[x.s]||0}</td>
          <td class="big">${tr?(r<=0?'<span class="pill-out">SOLD OUT</span>':r<=3?`<span class="pill-low">${r}</span>`:r):'—'}</td>
          <td style="white-space:nowrap"><button class="giftbtn" data-act="stockEdit" data-s="${esc(x.s)}">修正</button> <button class="giftbtn" data-act="giftNew" data-s="${esc(x.s)}">プレゼント</button></td>
        </tr>`}).join('')}</tbody></table></div>
      </div>`}).join('')}
    <button class="btn out" data-act="go" data-v="setup">開始在庫・釣銭準備金をまとめて編集</button>`;
}
function tHist(a,e){
  const tx=txOf(e.id).reverse();
  const f=UI.hf;
  const shown=tx.filter(t=>f==='all'||(f==='unmemo'&&!t.memo&&!t.v)||(f==='gift'&&t.items.some(i=>i.g))||(f==='coupon'&&t.cp)||(f==='refund'&&((t.rf&&t.rf.length)||t.v)));

  return `<div class="row wrap" style="gap:8px;margin:6px 0 14px">${chips.map(c=>`<button class="chip ${f===c[0]?'on':''}" data-act="hf" data-f="${c[0]}">${c[1]}</button>`).join('')}</div>

        ${t.note?`<div class="small">メモ：${esc(t.note)}</div>`:''}</div>
        <div class="num strike" style="font-weight:800;font-size:18px">${yen(t.total)}</div>

}
function tSum(a,e){
  const st=calc(e);const list=skus(a);
  const avg=st.customers?Math.round(st.total/st.customers):0;
  const pays=[['現金',st.cash,'var(--ink)'],['キャッシュレス',st.card,'#8F8F8F'],['その他',st.other,'var(--mark)']];
  const sumPay=st.cash+st.card+st.other;
  return `<div style="margin:6px 0 4px" class="eyebrow">売上合計</div>
  <div class="num" style="font-weight:900;font-size:52px;line-height:1.05"><span class="mk">${yen(st.total)}</span></div>
  ${st.disc||st.refund||st.cpN?`<div class="small" style="margin-top:4px">${[st.disc?`値引き ${yen(st.disc)}`:'',st.cpN?`クーポン ${yen(st.cpAmt)}（${st.cpN}件）`:'',st.refund?`返金 ${yen(st.refund)}（${st.refundN}件）`:''].filter(Boolean).join('・')} を引いた金額</div>`:''}

}
function cashDiffHTML(e,st){
  if(e.cashCount==null)return '<p class="hint">締めのときに数えた金額を入れると、差額を出します。</p>';
  const d=e.cashCount-((e.float||0)+st.cash);
  if(d===0)return '<div style="font-weight:900;font-size:20px"><span class="mk">ぴったり合っています</span></div>';
  return `<div style="font-weight:900;font-size:20px;color:var(--alert)">${d>0?'多い':'足りない'}：<span class="num">${yen(Math.abs(d))}</span></div><p class="hint">プレゼントや値引きの記録漏れ、お釣りの渡し間違いがないか確認してください。</p>`;
}

/* --- 会計完了 --- */
function vDone(){
  const t=TX(UI.lastTx);
  if(!t){UI.view='event';return vEvent()}
  const giftOnly=t.total===0&&t.items.every(i=>i.g);
  return `${topBar('',`<span class="small">${giftOnly?'プレゼントを記録しました':'お会計完了'}</span>`)}
  <div class="display" style="margin:14px 0 6px;font-size:${t.reg?56:72}px">${noLabel(t)}</div>
  <div class="small">${hm(t.t)} ・ ${PAY[t.pay]}${t.ed?' ・ 修正済み':''}</div>
  ${txNotes(t).length?`<div style="margin:22px 0 0"><div class="small" style="margin-bottom:6px">忘れずに</div>${txNotes(t).map(p=>`<div class="note-box" style="margin-bottom:8px">${esc(p.name)}：${esc(p.note)}</div>`).join('')}</div>`:''}
  <div style="margin:22px 0">${t.items.map(i=>`<div class="kv"><span style="font-weight:700">${esc(i.n)} ×${i.q}${i.g?' <span class="mk">プレゼント</span>':''}</span><span class="num">${yen(i.p*i.q)}</span></div>`).join('')}
  ${t.disc?`<div class="kv"><span>値引き</span><span class="num">−${yen(t.disc)}</span></div>`:''}
  ${t.cp?`<div class="kv"><span>クーポン「${esc(t.cp.name)}」</span><span class="num">−${yen(t.cp.amt)}</span></div>`:''}</div>
  ${giftOnly?'':`<div class="kv"><span>合計</span><b>${yen(t.total)}</b></div>
  ${t.pay==='cash'?`<div class="kv"><span>お預かり</span><b>${yen(t.recv)}</b></div>
  <div style="margin-top:26px"><div class="small">お釣り</div><div class="num" style="font-weight:900;font-size:64px;line-height:1.1"><span class="mk">${yen(t.recv-t.total)}</span></div></div>`:''}`}
  <div class="dockwrap dock"><div class="in">
    <button class="btn inv" data-act="next">次のお客さまへ</button>
    <button class="btn out" data-act="editTx" data-id="${t.id}">内容を直す（${noLabel(t)}のまま）</button>
  </div></div>`;
}

/* ===== シート ===== */
function openSheet(s){UI.sheet=s;renderLayer()}
function closeSheet(){UI.sheet=null;renderLayer()}
function renderLayer(){
  const s=UI.sheet;const L=$('#layer');
  if(!s){L.innerHTML='';return}
  const fn=SHEETS[s.type];if(!fn){L.innerHTML='';return}
  const prevScroll=L.querySelector('.sheet')?.scrollTop||0;
  L.innerHTML=`<div class="layer" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true">${fn(s)}</div></div>`;
  const sh=L.querySelector('.sheet');if(sh&&s.keepScroll)sh.scrollTop=prevScroll;
  s.keepScroll=true;
}

function handleCode(code,target){

let SCAN=null;
function closeScanner(){if(!SCAN)return;SCAN.stop=true;try{SCAN.stream&&SCAN.stream.getTracks().forEach(t=>t.stop())}catch(e){}const el=$('#scan');if(el)el.remove();SCAN=null}
async function openScanner(target){
  if(typeof jsQR!=='function'){toast('読み取りの準備ができていません。電波のよい所でページを開き直してください');return}
  closeScanner();
  const el=document.createElement('div');el.id='scan';
  el.innerHTML=`<video playsinline muted autoplay></video><div class="frame"></div><div class="msg">QRコードを黄色い枠に入れてください</div>
    <div class="bot"><label class="btn out" style="background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #fff;cursor:pointer" for="f-scanfile">写真で読む</label><input type="file" id="f-scanfile" accept="image/*" capture="environment" data-qr="${target}" hidden>
    <button class="btn inv" data-act="scanClose">やめる</button></div>`;
  document.body.appendChild(el);
  SCAN={stop:false,stream:null};const me=SCAN;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(me.stop){stream.getTracks().forEach(t=>t.stop());return}
    me.stream=stream;const v=el.querySelector('video');v.srcObject=stream;await v.play().catch(()=>{});
    const c=document.createElement('canvas');const x=c.getContext('2d',{willReadFrequently:true});
    const tick=()=>{if(me.stop)return;
      if(v.readyState>=2&&v.videoWidth){const sc=Math.min(1,720/Math.max(v.videoWidth,v.videoHeight));c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);
        x.drawImage(v,0,0,c.width,c.height);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'attemptBoth'});
        if(r&&r.data){buzz(40);closeScanner();handleCode(r.data,target);return}}
      setTimeout(tick,120)};
    tick();
  }catch(e){
    const m=el.querySelector('.msg');if(m)m.innerHTML='カメラを使えませんでした。<br><span style="font-size:13px;font-weight:700">iPhoneの「設定」→ Safari →「カメラ」で許可するか、「写真で読む」を使ってください。</span>';
  }
}
async function onQR(file,target){
  closeScanner();
  try{const code=await decodeQR(file);
    if(!code){toast('QRコードが読み取れませんでした。QRを大きく、ピントを合わせて撮ってください');buzz(120);return}
    handleCode(code,target);return;
    if(target==='cart'){if(applyCoupon(code))renderLayer()}
    else if(target==='edit'&&UI.sheet&&UI.sheet.type==='coupon'){const cur=String(UI.sheet.codes||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!cur.includes(code))cur.push(code);UI.sheet.codes=cur.join('\n');renderLayer();toast('コードを追加しました')}
  }catch(e){toast(e&&e.message==='nolib'?'読み取りの準備ができていません。電波のよい所でページを開き直してください':'写真を読み込めませんでした')}
}

function squareCanvas(img,max){const side=Math.min(img.naturalWidth,img.naturalHeight);const size=Math.min(max,side);const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);x.drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,size,size);return c}

  svAdd(d){const s=UI.sheet;s.val=Math.max(0,(digits(s.val)||0)+Number(d.v));const el=$('#f-sv');if(el)el.value=s.val},
  saveStock(){const e=EV(UI.eid);const s=UI.sheet;const v=digits(s.val);if(v==null)delete e.stock[s.s];else e.stock[s.s]=v;closeSheet();commit('e_'+e.id)},
  giftNew(d){openSheet({type:'gift',s:d.s,q:1,note:''})},
  giftQty(d){const s=UI.sheet;s.q=Math.max(1,s.q+Number(d.d));renderLayer()},
  saveGift(){const a=AR(UI.aid),e=EV(UI.eid);const s=UI.sheet;const x=skuMap(a)[s.s];if(!x)return;
    const st=calc(e);if(st.remain(s.s)<s.q){toast('在庫が足りません。先に在庫数を修正してください');return}
    if(isTeam(e)&&!myReg(e.id)){openSheet({type:'reg',val:''});toast('先にこのスマホのレジ名を決めてください');return}
    const t=newTx(e,{items:[{s:s.s,n:x.label,q:s.q,p:0,g:1}],sub:0,disc:0,total:0,pay:'none',recv:null,note:(s.note||'').trim()});
    closeSheet();commit('x_'+t.id);toast('プレゼントを記録しました')},
  denOpen(d){const ev=EV(UI.eid);const src=d.t==='float'?ev.floatDen:ev.countDen;openSheet({type:'den',target:d.t,den:Object.assign({},src||{})});denRefresh()},
  denQ(d){const s=UI.sheet;const v=d.v;s.den[v]=Math.max(0,(s.den[v]||0)+Number(d.d));const el=$('#den-'+v);if(el)el.value=s.den[v]||'';buzz(6);denRefresh()},
  denClear(){UI.sheet.den={};UI.sheet.keepScroll=false;renderLayer();denRefresh()},
  denSave(){const ev=EV(UI.eid);const s=UI.sheet;const den={};DEN.forEach(([v])=>{if(s.den[v])den[v]=s.den[v]});const tot=denTotal(den);
    if(s.target==='float'){ev.float=tot;ev.floatDen=den}else{ev.cashCount=tot;ev.countDen=den}
    closeSheet();commit('e_'+ev.id);toast(`${yen(tot)} を入れました`)},
  deviceMenu(){openSheet({type:'device'})},
  async apiSave(){let u=String((UI.tmp&&UI.tmp.api)||'').trim();
    if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(u)){toast('「https://script.google.com/macros/s/…/exec」の形のURLを入れてください');return}
    u=u.replace(/\?.*$/,'');toast('つないでいます…');
    try{const st=await call('status',null,u);if(!st||typeof st.hasAdmin!=='boolean')throw new Error('bad');
      localStorage.setItem(API_KEY,u);location.reload()}
    catch(e){toast('つながりませんでした。URLと、デプロイの「アクセスできるユーザー：全員」を確認してください')}},
  localOnly(){UI.localOnly=true;try{localStorage.setItem('merch-register-local','1')}catch(e){}render()},
  apiChange(){try{localStorage.removeItem(API_KEY);localStorage.removeItem('merch-register-local')}catch(e){}location.reload()},
  copyStaffLink(){copyText(location.origin+location.pathname+'?s='+apiId(API_URL))},
  scan(d){openScanner(d.t)},
  scanClose(){closeScanner()},
  askOut(){UI.sheet.confirmOut=true;renderLayer()},
  logout(){try{localStorage.removeItem(LS)}catch(e){}location.reload()},
  adminLogin(){openSheet({type:'admin',pass:''})},
  async adminDo(){const p=UI.sheet.pass||'';if(!p){toast('パスワードを入れてください');return}
    try{const r=await call('checkAdmin',{pass:p});
      if(r.ok){AUTH.master=p;SINCE=0;saveLocal();closeSheet();render();sync();toast('管理者としてログインしました')}
      else toast(r.error==='wait'?'失敗が続いたので、少し待ってからもう一度試してください':'パスワードが違います')}
    catch(e){toast('通信できませんでした')}},
  joinMore(){openSheet({type:'join',code:''})},
  joinCode(){joinWith(UI.tmp&&UI.tmp.code)},
  joinDo(){joinWith(UI.sheet.code)},
  async setAdmin(){const t=UI.tmp||{};if(!t.ap||t.ap.length<6){toast('6文字以上にしてください');return}if(t.ap!==t.ap2){toast('2回の入力が違います');return}
    try{const r=await call('setAdmin',{pass:t.ap});
      if(r.ok){AUTH.master=t.ap;R.hasAdmin=true;UI.tmp={};saveLocal();render();sync();toast('管理者パスワードを決めました')}
      else if(r.error==='exists'){R.hasAdmin=true;render();toast('すでに管理者パスワードが決まっています')}
      else toast('6文字以上にしてください')}
    catch(e){toast('通信できませんでした')}},
  codeOpen(){openSheet({type:'code',code:''})},
  async codeSave(){const a=AR(UI.aid);const code=String(UI.sheet.code||'').trim();if(code.length<6){toast('6文字以上にしてください');return}
    flushSoon();if(dirty.has('a_'+a.id)||!a.shared){a.shared=true;commit('a_'+a.id,{render:false})}
    try{const r=await call('setCode',{auth:AUTH,aid:a.id,code});
      if(r.ok){closeSheet();render();toast('合言葉を決めました。スタッフに伝えてください')}
      else toast(r.error==='dup'?'その合言葉は別のアーティストで使っています':r.error==='short'?'6文字以上にしてください':'設定できませんでした')}
    catch(e){toast('通信できませんでした。電波のよい所で試してください')}},
  leaveArtist(){const a=AR(UI.aid);delete AUTH.codes[a.id];for(const [k,d] of Object.entries(S.docs))if(aidOf(d)===a.id&&!dirty.has(k))delete S.docs[k];
    UI.aid=null;UI.view='home';closeSheet();saveLocal();render();toast('この端末から外しました')},
  regOpen(){openSheet({type:'reg',val:myReg(UI.eid)})},
  regSet(d){UI.sheet.val=d.v;const el=$('#f-reg');if(el)el.value=d.v;$$('.regbtns button').forEach(b=>b.classList.toggle('on',b.dataset.v===d.v))},
  regSave(){const v=String(UI.sheet.val||'').trim().slice(0,6);if(!v){toast('レジ名を選ぶか入れてください');return}
    const then=UI.sheet.then;UI.regs[UI.eid]=v;saveLocal();closeSheet();render();toast(`レジ名を「${v}」にしました`);if(then==='cart')openSheet({type:'cart'})},
  copyReport(){copyText(reportText())},
  copyCSV(){copyText(csvText())}
};
async function joinWith(code){
  code=String(code||'').trim();if(!code){toast('合言葉を入れてください');return}
  try{const r=await call('join',{code});
    if(r.ok){AUTH.codes[r.aid]=code;SINCE=0;UI.tmp={};saveLocal();closeSheet();render();sync();toast('参加しました。読み込み中…')}
    else toast(r.error==='wait'?'失敗が続いたので、少し待ってからもう一度試してください':'合言葉が違います')}
  catch(e){toast('通信できませんでした')}
}
function nextCustomer(skipRender){UI.view='event';UI.tab='reg';UI.lastTx=null;UI.sheet=null;window.scrollTo(0,0);saveLocal();if(!skipRender)render()}

/* ===== 出力 ===== */
function reportText(){
  const a=AR(UI.aid),e=EV(UI.eid);const st=calc(e);
  const L=[`【物販集計】${a.name}`,`${e.date||''} ${e.name||''}`,'',
    `売上 ${yen(st.total)}`,`（現金 ${yen(st.cash)}／キャッシュレス ${yen(st.card)}${st.other?`／その他 ${yen(st.other)}`:''}）`,
    `お客さま ${st.customers}人・販売 ${st.items}点${st.disc?`・値引き ${yen(st.disc)}`:''}${st.refund?`・返金 ${yen(st.refund)}`:''}${st.cpN?`・クーポン ${st.cpN}件 ${yen(st.cpAmt)}`:''}`,`プレゼント ${st.giftN}点`,'','―― 商品別（販売／プレゼント／残り）――'];
  skus(a).forEach(x=>{L.push(`${x.label}：${st.sold[x.s]||0}／${st.gift[x.s]||0}／${st.tracked(x.s)?st.remain(x.s):'-'}`)});
  L.push('',`釣銭準備金 ${yen(e.float||0)}`,`レジにあるべき現金 ${yen((e.float||0)+st.cash)}`);
  if(e.floatDen&&denText(e.floatDen))L.push(`（内訳 ${denText(e.floatDen)}）`);
  if(e.cashCount!=null){const d=e.cashCount-((e.float||0)+st.cash);L.push(`実際の現金 ${yen(e.cashCount)}（${d===0?'差額なし':(d>0?'+':'−')+yen(Math.abs(d))}）`);if(e.countDen&&denText(e.countDen))L.push(`（内訳 ${denText(e.countDen)}）`)}
  const rfs=txOf(e.id).filter(t=>!t.v&&t.rf&&t.rf.length);
  if(rfs.length){L.push('','―― 返金・キャンセル ――');rfs.forEach(t=>t.rf.forEach(r=>L.push(`${noLabel(t)} −${yen(r.amt)}（${PAY[r.pay]||''}）${r.items.map(x=>(t.items[x.i]?t.items[x.i].n:'')+'×'+x.q).join('、')}${r.back?'':' ※在庫に戻さず'}${r.note?' '+r.note:''}`)))}
  const gifts=txOf(e.id).filter(t=>!t.v&&t.items.some(i=>i.g));
  if(gifts.length){L.push('','―― プレゼント明細 ――');gifts.forEach(t=>L.push(`${noLabel(t)} ${t.items.filter(i=>i.g).map(i=>i.n+'×'+i.q).join('、')}${t.note?'（'+t.note+'）':''}`))}
  return L.join('\n');
}
function csvText(){
  const e=EV(UI.eid);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['No','時刻','内容','小計','値引き','クーポン','合計','支払い','お預かり','返金','メモ済','取消','備考']];
  txOf(e.id).forEach(t=>rows.push([noLabel(t),hm(t.t),t.items.map(i=>i.n+'×'+i.q+(i.g?'(プレゼント)':'')).join(' / '),t.sub,t.disc||0,t.cp?t.cp.name+' −'+t.cp.amt:'',t.total,PAY[t.pay],t.recv??'',rfAmt(t)||'',t.memo?'済':'',t.v?'取消':'',t.note||'']));
  return rows.map(r=>r.map(q).join(',')).join('\n');
}
function copyText(txt){
  try{navigator.clipboard.writeText(txt).then(()=>toast('コピーしました'),()=>openSheet({type:'copy',text:txt}))}
  catch(e){openSheet({type:'copy',text:txt})}
}
let toastT;
function toast(msg){const el=$('#toast');el.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>el.innerHTML='',2600)}

/* ===== イベント結線 ===== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const fn=ACT[el.dataset.act];if(!fn)return;
  if(el.dataset.act==='backdrop'&&e.target!==el)return;
  fn(el.dataset,el,e);
});
document.addEventListener('input',e=>{
  const el=e.target;const b=el.dataset&&el.dataset.bind;if(!b)return;
  const ev=EV(UI.eid);
  if(b==='sf'){if(UI.sheet)UI.sheet[el.dataset.k]=el.value}
  else if(b==='tmp'){UI.tmp=UI.tmp||{};UI.tmp[el.dataset.k]=el.value}
  else if(b==='stock'&&ev){const v=digits(el.value);if(v==null)delete ev.stock[el.dataset.s];else ev.stock[el.dataset.s]=v;saveSoon('e_'+ev.id)}
  else if(b==='float'&&ev){ev.float=digits(el.value)||0;ev.floatDen=null;saveSoon('e_'+ev.id)}
  else if(b==='cashCount'&&ev){ev.cashCount=digits(el.value);ev.countDen=null;const box=$('#cashDiff');if(box)box.innerHTML=cashDiffHTML(ev,calc(ev));saveSoon('e_'+ev.id)}
  else if(b==='recv'){UI.recv=digits(el.value);updateCart()}
  else if(b==='den'&&UI.sheet&&UI.sheet.type==='den'){UI.sheet.den[el.dataset.k]=digits(el.value)||0;denRefresh()}
  else if(b==='rfamt'&&UI.sheet){UI.sheet.amt=digits(el.value)??0}
  else if(b==='disc'){UI.disc=digits(el.value)||0;updateCart()}
  else if(b==='txnote'){const t=TX(el.dataset.id);if(t){t.note=el.value;saveSoon('x_'+t.id)}}
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.qr&&el.files&&el.files[0]){onQR(el.files[0],el.dataset.qr);el.value='';return}if(el.dataset&&el.dataset.photo&&el.files&&el.files[0]){onPhoto(el.files[0]);el.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.sheet)closeSheet();if(e.key==='Enter'&&e.target.matches('input')){const m={'f-code':'joinCode','f-jc':'joinDo','f-mp':'adminDo'}[e.target.id];if(m){e.preventDefault();ACT[m]()}}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSoon()});
window.addEventListener('pagehide',flushSoon);

loadLocal();
start();
</script>
